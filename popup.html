<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>FrameMe</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #1a1a1a;
            color: #fff;
            margin: 0;
            padding: 16px;
            width: 250px;
        }

        h2 {
            margin-top: 0;
            font-size: 16px;
            font-weight: 500;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 16px;
        }

        label {
            font-size: 12px;
            color: #a0a0a0;
        }

        a {
            text-decoration: none;
            color: #9C1E22;
        }

        input[type="text"] {
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #333;
            background-color: #2a2a2a;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: #646cff;
        }

        button {
            background-color: #646cff;
            color: #fff;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: background-color 0.2s;
            width: 100%;
        }

        button:hover:not(:disabled) {
            background-color: #535bf2;
        }

        button:disabled {
            background-color: #444;
            color: #888;
            cursor: not-allowed;
        }

        .status {
            margin-top: 12px;
            font-size: 12px;
            color: #4caf50;
            text-align: center;
            height: 14px;
        }

        footer {
            text-align: center;

            p {
                font-size: .825rem;
            }
        }
    </style>
</head>

<body>
    <h2>FrameMe Setup</h2>
    <div class="form-group">
        <label for="ip-input">Meural Canvas Frame IP Address</label>
        <input type="text" id="ip-input" placeholder="e.g. 192.168.1.101">
    </div>
    <button id="save-btn">Save Settings</button>
    <div class="status" id="status-message"></div>
    <script src="popup.js"></script>
    <footer>
        <p>Made with ❤️ in Oakland</p>
    </footer>
</body>

</html>
